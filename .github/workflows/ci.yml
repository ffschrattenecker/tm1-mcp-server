name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The exact gate `npm publish` runs (prepublishOnly → verify), so a tag
      # can never pass CI and then fail at publish time.
      - name: Verify (typecheck, lints, format, tests + coverage ratchet)
        run: npm run verify

      # Tier 1 only: bin wiring, shebang, files allow-list, unconfigured start.
      # No TM1 server in CI, so tier 2 is always skipped.
      - name: Smoke-test the tarball
        run: npm run smoke:tarball -- --target=none --allow-skip

      # Consumers install from npm-shrinkwrap.json, which pins the whole
      # production tree, so this audits what they actually get. Dev-only
      # advisories (e.g. vite via vitest) don't reach users.
      - name: Audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

      # Full-tree audit incl. devDependencies — informational, never blocks.
      - name: Audit (all deps, informational)
        run: npm audit --audit-level=high
        continue-on-error: true
