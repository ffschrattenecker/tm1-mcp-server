name: Publish to npm

# Publishes @ffschrattenecker/tm1-mcp-server when a vX.Y.Z tag is pushed
# (`npm version <level>` + `git push --follow-tags`, see RELEASING.md).
# Runs on Linux, where `verify` is green; prepublishOnly runs it again.
# Authenticates via npm trusted publishing (OIDC, configured on npmjs.com for
# this repo + workflow file) — no token or secret needed.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ffschrattenecker/tm1-mcp-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json
        run: |
          v="$(node -p 'require("./package.json").version')"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $v" >&2
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Smoke-test the tarball
        # No TM1 server in CI: tier 2 is always skipped, which exits 3 without --allow-skip.
        run: npm run smoke:tarball -- --target=none --allow-skip

      - name: Publish
        run: npm publish --provenance --access public
