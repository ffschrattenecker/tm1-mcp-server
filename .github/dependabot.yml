version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a fresh release age a week before proposing it: compromised versions
    # are usually caught and yanked within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint peer-caps typescript at <6.1.0, so a TS major cannot
      # install at all (npm ci fails ERESOLVE). Lift once typescript-eslint
      # supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
