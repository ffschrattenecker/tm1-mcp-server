version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # @vitest/coverage-v8 pins an exact vitest peer, so separate PRs for the
      # pair can never install (ERESOLVE). Listed first: the first match wins.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint peer-caps typescript at <6.1.0, so a TS major cannot
      # install at all (npm ci fails ERESOLVE). Lift once typescript-eslint
      # supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
